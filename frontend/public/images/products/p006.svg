<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Background -->
  <rect width="200" height="220" rx="16" fill="#FFFFFF"/>
  <circle cx="100" cy="120" r="75" fill="#F3E8FF" opacity="0.4"/>
  
  
        <!-- Cap -->
        <rect x="80" y="25" width="40" height="35" rx="4" fill="#5C2D91" />
        <!-- Bottle Body -->
        <rect x="70" y="60" width="60" height="145" rx="12" fill="white" stroke="#5C2D91" stroke-width="3" />
        <rect x="75" y="65" width="50" height="135" rx="8" fill="#F3E8FF" opacity="0.5" />
        <!-- Label -->
        <rect x="75" y="95" width="50" height="85" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1.5" />
        <rect x="80" y="103" width="40" height="3" rx="1.5" fill="#5C2D91" />
        

  <!-- Brand & Product Text on Bottle Label -->
  <text x="100" y="130" font-family="sans-serif" font-size="7" font-weight="bold" fill="#5C2D91" text-anchor="middle" letter-spacing="0.5">PLUM</text>
  <text x="100" y="142" font-family="sans-serif" font-size="6" font-weight="600" fill="#334155" text-anchor="middle">Hydra Rose Water..</text>
