<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Background -->
  <rect width="200" height="220" rx="16" fill="#FFFFFF"/>
  <circle cx="100" cy="120" r="75" fill="#FDEDEC" opacity="0.4"/>
  
  
        <!-- Tube Crimped Top -->
        <rect x="75" y="25" width="50" height="8" rx="2" fill="#8E1616" />
        <!-- Tube Body -->
        <path d="M 75 33 L 125 33 L 132 155 Q 100 170 68 155 Z" fill="white" stroke="#8E1616" stroke-width="3" />
        <path d="M 78 38 L 122 38 L 128 150 Q 100 162 72 150 Z" fill="#FDEDEC" opacity="0.5" />
        <!-- Cap -->
        <rect x="78" y="160" width="44" height="30" rx="6" fill="#8E1616" />
        <!-- Label -->
        <rect x="76" y="60" width="48" height="75" rx="4" fill="white" stroke="#E2E8F0" />
        <circle cx="100" cy="88" r="14" fill="#FDEDEC" stroke="#D98880" stroke-width="1.5" />
        <text x="100" y="92" font-size="9" font-weight="bold" fill="#D98880" text-anchor="middle">SPF</text>
        

  <!-- Brand & Product Text on Bottle Label -->
  <text x="100" y="130" font-family="sans-serif" font-size="7" font-weight="bold" fill="#8E1616" text-anchor="middle" letter-spacing="0.5">LAKME</text>
  <text x="100" y="142" font-family="sans-serif" font-size="6" font-weight="600" fill="#334155" text-anchor="middle">Sun Expert SPF 5..</text>
  <text x="100" y="152" font-family="sans-serif" font-size="5" fill="#64748B" text-anchor="middle">SUNSCREEN</text>
