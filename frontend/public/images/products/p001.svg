<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Background -->
  <rect width="200" height="220" rx="16" fill="#FFFFFF"/>
  <circle cx="100" cy="120" r="75" fill="#EBF4FA" opacity="0.4"/>
  
  
        <!-- Pump Head -->
        <rect x="90" y="32" width="20" height="8" rx="2" fill="#E2E8F0" />
        <rect x="97" y="40" width="6" height="15" fill="#CBD5E1" />
        <rect x="75" y="24" width="35" height="10" rx="3" fill="#E2E8F0" />
        <rect x="70" y="27" width="10" height="4" rx="1" fill="#94A3B8" />
        <!-- Bottle Neck -->
        <rect x="86" y="55" width="28" height="15" rx="3" fill="#005696" />
        <!-- Bottle Body -->
        <rect x="62" y="70" width="76" height="130" rx="16" fill="white" stroke="#005696" stroke-width="3" />
        <rect x="68" y="76" width="64" height="118" rx="12" fill="#EBF4FA" opacity="0.4" />
        <!-- Label -->
        <rect x="70" y="90" width="60" height="90" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1.5" />
        <rect x="76" y="98" width="48" height="4" rx="2" fill="#005696" />
        

  <!-- Brand & Product Text on Bottle Label -->
  <text x="100" y="130" font-family="sans-serif" font-size="7" font-weight="bold" fill="#005696" text-anchor="middle" letter-spacing="0.5">CERAVE</text>
  <text x="100" y="142" font-family="sans-serif" font-size="6" font-weight="600" fill="#334155" text-anchor="middle">Foaming Face Wash</text>
  <text x="100" y="152" font-family="sans-serif" font-size="5" fill="#64748B" text-anchor="middle">CLEANSER</text>
</svg>